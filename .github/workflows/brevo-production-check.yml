name: One authorized Brevo production check
on:
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  contents: read
jobs:
  production:
    if: github.head_ref == 'qa/brevo-recheck-20261030' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both sites and submit one labelled SteelVision test
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          for (const origin of ['https://bcore-business.onrender.com', 'https://bcore-cinematic-live.onrender.com']) {
            const page = await fetch(origin, {signal: AbortSignal.timeout(90000)});
            assert.equal(page.status, 200);
            console.log('Website available:', origin);
          }
          const response = await fetch('https://bcore-business.onrender.com/api/steel-enquiries', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            signal: AbortSignal.timeout(90000),
            body: JSON.stringify({
              name: 'TEST TECHNICZNY B-CORE', email: 'test@example.com', phone: '',
              category: 'TEST BREVO - NIE JEST ZAMOWIENIEM',
              message: 'TEST TECHNICZNY: sprawdzenie dostarczenia PDF, CSV i pelnego projektu JSON w ZIP. To nie jest zapytanie klienta.',
              design: {
                version: 'B-CORE-SteelVision-19', quoteId: 'brevo-production-test-20261030-once',
                project: {projectName: 'TEST zalacznikow Brevo', projectRef: 'QA-BREVO-20261030'},
                state: {items: [{name: 'TEST Balustrada', type: 'railing', qty: 1, shape: 'L',
                  segments: [{name: 'Front', length: 4.6, angle: 0, jointType: 'Spawane', jointGap: 0}]}]},
                report: {createdAt: '2026-10-30T00:00:00.000Z', corrections: [],
                  validation: {blockers: 0, warnings: 0, issues: []},
                  integrity: {passed: 1, total: 1, issues: []}}
              }
            })
          });
          const result = await response.json();
          console.log('Synthetic test result:', JSON.stringify(result));
          assert.equal(response.status, 201);
          assert.equal(result.emailed, true);
          assert.deepEqual(result.reports, ['PDF', 'CSV', 'JSON']);
          NODE
